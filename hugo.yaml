baseURL: https://blog.paoloboi.com/
languageCode: en-gb
title: Paolo's blog
theme: ["PaperMod"]
#copyright: "© 2026 Paolo's blog. All rights reserved."

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

caches:
  images:
    dir: :cacheDir/images

markup:
  defaultMarkdownHandler: goldmark
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: monokai
  goldmark:
    parser:
      attribute:
        block: true

params:
  author:
    name: "Paolo"
    email: ""
  params:
    assets:
      disableHLJS: true

  disableThemeToggle: true
  disableAnchoredHeadings: true

  HideAuthor: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowToc: false
  ShowDescription: true

  footer:
    text: "All rights reserved · Made in Sardinia with 💙"

  homeInfoParams:
    Title: Hi there! 👋
    Content: >
      I'm Paolo, and this blog is still very much a work in progress.


      With over 10 years as a software engineer (currently at a fintech company), I'd love to share my thoughts on coding, tech, my homelab projects, and anything else that piques my interest.


      Please feel free to reach out anytime!

  socialIcons:
    - name: github
      url: "https://github.com/boi-wan"
    - name: linkedin
      url: "https://linkedin.com/in/paoloboi"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
