baseURL: https://blog.paoloboi.com/
locale: en-gb
title: Paolo's blog
theme: ["PaperMod"]
#copyright: "© 2026 Paolo's blog. All rights reserved."

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

caches:
  images:
    dir: :cacheDir/images

markup:
  defaultMarkdownHandler: goldmark
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: monokai
  goldmark:
    parser:
      attribute:
        block: true

params:
  author:
    name: "Paolo"
    email: ""
  params:
    assets:
      disableHLJS: true

  assets:
    favicon: "favicon.svg"

  label:
    iconSVG: '<svg width="28" height="28" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141820"/><rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#2a3342" stroke-width="3"/><path d="M18 46V18H27C31.5 18 35 21 35 25.5C35 30 31.5 33 27 33H18" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="45" x2="48" y2="45" stroke="#5ca8dc" stroke-width="5" stroke-linecap="round"/></svg>'

  disableThemeToggle: false
  disableAnchoredHeadings: true

  HideAuthor: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowToc: true
  ShowDescription: true

  footer:
    text: "All rights reserved · Made in Sardinia with 💙"

  homeInfoParams:
    Title: Hi there! 👋
    Content: >
      I'm Paolo, and this blog is still very much a work in progress.


      With over 10 years as a software engineer (currently at a fintech company), I'd love to share my thoughts on coding, tech, my homelab projects, and anything else that piques my interest.


      Please feel free to reach out anytime!

  socialIcons:
    - name: github
      url: "https://github.com/boi-wan"
    - name: linkedin
      url: "https://linkedin.com/in/paoloboi"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
